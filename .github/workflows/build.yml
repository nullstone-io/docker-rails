name: Build and Push

on:
  workflow_dispatch:

env:
  IMAGE: nullstone/rails
  # The Ruby minor version the common tags track. Keep in sync with the
  # LATEST_RUBY / LATEST_RUBY_MAJOR values in the Makefile.
  LATEST_RUBY: "3.4"
  LATEST_RUBY_MAJOR: "3"

jobs:
  # Turn ruby_versions.txt into a JSON array that drives the build matrix.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
      - id: set
        run: |
          versions=$(grep -v '^[[:space:]]*$' ruby_versions.txt \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Building versions: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  # Build + push every Ruby version in parallel. The normal and webapp images
  # build as separate matrix jobs (one per version per target).
  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.matrix.outputs.versions) }}
        target: [normal, webapp]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Ruby ${{ matrix.version }} (${{ matrix.target }})
        run: RUBY_VERSION=${{ matrix.version }} docker buildx bake --push ${{ matrix.target }}

  # After every version is published, point the common tags at the latest.
  retag:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Apply common tags
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:ruby${LATEST_RUBY_MAJOR}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:ruby${LATEST_RUBY}"
          docker buildx imagetools create \
            -t "${IMAGE}:ruby${LATEST_RUBY_MAJOR}-webapp" \
            -t "${IMAGE}:webapp" \
            "${IMAGE}:ruby${LATEST_RUBY}-webapp"
